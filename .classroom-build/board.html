<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리의 게임 게시판 · AI 셰르파</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--paper:#f8f6ef;--ink:#243238;--accent:#f65b16;--line:#dddcd2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}button,a{-webkit-tap-highlight-color:transparent}a{color:inherit}button,.button{font:700 15px/1.5 system-ui,sans-serif;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);padding:11px 17px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:disabled{opacity:.4;cursor:default}button:hover:enabled,.button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}header{max-width:1160px;margin:auto;padding:28px 28px 0;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:800;letter-spacing:.08em;font-size:14px}.brand span{color:var(--accent)}main{max-width:1160px;margin:0 auto;padding:54px 28px 64px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;color:#747d79;margin:0 0 12px}h1{font-size:clamp(32px,5vw,48px);line-height:1.25;letter-spacing:-.05em;margin:0}h1 span{color:var(--accent)}.intro{color:#66716e;margin:18px 0 34px;font-size:17px}.toolbar{border-top:2px solid var(--ink);padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar h2{font-size:18px;margin:0}.status{color:#6d7671;font-size:14px;min-height:24px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.card{display:flex;flex-direction:column;min-height:230px;padding:24px;border:1px solid var(--line);border-radius:14px;background:#fffdf8;text-align:left;align-items:stretch;justify-content:flex-start;position:relative;transition:transform .15s,border-color .15s}.card:hover:enabled{transform:translateY(-3px);border-color:var(--accent)}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.card-mark{font-size:25px;line-height:1;background:#fff0e3;color:var(--accent);width:46px;height:46px;border-radius:12px;display:grid;place-items:center}.card-size{font-size:12px;color:#828a83;font-weight:500}.card h3{font-size:20px;line-height:1.4;letter-spacing:-.03em;margin:0 0 12px;overflow-wrap:anywhere}.card-meta{color:#798077;font-size:13px;font-weight:400;margin-top:auto;overflow-wrap:anywhere}.card-play{color:var(--accent);font-size:13px;margin-top:18px}.empty{grid-column:1/-1;text-align:center;border:1px dashed #c9cdbf;border-radius:14px;padding:70px 24px;color:#6c776c}.empty strong{display:block;font-size:20px;color:var(--ink);margin-bottom:10px}.pagination{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:32px}.pagination span{font-size:14px;color:#748073}footer{border-top:1px solid var(--line);padding-top:24px;margin-top:48px;color:#8b9286;font-size:13px}.viewer{width:min(1140px,calc(100vw - 28px));max-height:calc(100dvh - 28px);padding:0;border:1px solid #ccd1c7;border-radius:16px;background:var(--paper);color:var(--ink)}.viewer::backdrop{background:#142328c9}.viewer[open]{display:flex;flex-direction:column}.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}.viewer-head h2{font-size:20px;line-height:1.35;overflow-wrap:anywhere;margin:0}.viewer-by{font-size:13px;color:#778173;margin-top:5px}.viewer-content{height:min(66dvh,680px);min-height:220px;background:#edf0e8;position:relative}.viewer-content iframe{display:block;border:0;width:100%;height:100%;background:white}.viewer-loading{padding:36px;color:#6d776b}.viewer-foot{padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}.viewer-foot p{font-size:13px;color:#74806e;margin:0}.viewer-foot .button{background:var(--accent);color:white;border-color:var(--accent)}[hidden]{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:740px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding-top:36px}.card{padding:20px;min-height:220px}.viewer-foot{flex-wrap:wrap}.viewer-head{padding:14px}.viewer-head h2{font-size:17px}}@media(max-width:440px){header,main{padding-left:18px;padding-right:18px}.grid{grid-template-columns:1fr}.card{min-height:195px}.card-top{margin-bottom:20px}header .button{font-size:13px;padding:9px 12px}}
</style>
<script src="/board.js" defer></script>
</head>
<body>
<header><div class="brand">AI <span>셰르파</span> · 작품 나누기</div><a class="button" href="/">← 수업으로 돌아가기</a></header>
<main>
<p class="eyebrow">MADE BY US</p><h1>우리가 만든<br><span>게임 게시판</span></h1>
<p class="intro">서로 다른 생각으로 만든 게임들.<br>작품을 눌러 직접 해 보고, 함께 이야기를 나눠 보세요.</p>
<div class="toolbar"><h2>공유한 작품</h2><button id="refresh" type="button">새로고침 ↻</button></div>
<div id="status" class="status" role="status" aria-live="polite"></div>
<div id="works" class="grid" aria-label="공유한 게임 목록"></div>
<nav class="pagination" aria-label="작품 목록 페이지"><button id="previous" type="button" disabled>← 이전</button><span id="page">1 페이지</span><button id="next" type="button" disabled>다음 →</button></nav>
<footer>수업 마지막 화면에서 ‘공유하기’를 누르면 이곳에 작품이 올라와요.</footer>
</main>
<dialog id="viewer" class="viewer" aria-labelledby="work-title"><div class="viewer-head"><div><h2 id="work-title">공유한 게임</h2><div id="work-by" class="viewer-by"></div></div><button id="close" type="button" aria-label="게임 닫기">닫기 ×</button></div><div id="play" class="viewer-content"></div><div class="viewer-foot"><p id="play-hint">게임 화면을 클릭한 뒤 조작해 보세요.</p><a id="download" class="button" hidden>HTML 다운로드 ↓</a></div></dialog>
</body>
</html>
