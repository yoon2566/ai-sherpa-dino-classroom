.lesson-frame{position:relative}
.with-classroom .classroom-banner{position:static;transform:none;max-width:none;flex:1;min-width:0;border:0;border-radius:0;padding:0;background:transparent;box-shadow:none;font-size:13px;font-weight:650;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.classroom-header{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:14px;height:48px;padding:0 22px;background:#f7f8f1;border-bottom:1px solid #dce2d2;font-size:12px;font-family:inherit}
.classroom-back{color:#5e6d55;text-decoration:none;flex:none}
.classroom-role{border-radius:5px;padding:4px 7px;background:#e7eddf;color:#4a6240;flex:none;font-size:11px}
.classroom-header button{min-height:31px;padding:5px 10px;border:1px solid #d6decb;border-radius:6px;background:#fffdf8;font-size:11px;color:#556a48;text-decoration:none;white-space:nowrap}
.with-classroom .stage{padding-top:60px}
.with-classroom .slide-wrap{width:min(1280px,calc(100vw - 40px),calc((100dvh - 160px)*16/9))}
.classroom-teacher .stage{padding-top:104px}
.classroom-teacher .slide-wrap{width:min(1280px,calc(100vw - 40px),calc((100dvh - 206px)*16/9))}
.classroom-lock-controls{position:absolute;right:0;bottom:calc(100% + 12px);z-index:8;display:flex;align-items:center;gap:8px;white-space:nowrap}
.classroom-lock-label{font-size:12px;color:#777d72;margin-right:2px}
.classroom-lock-button{min-height:34px;padding:6px 13px;border:1px solid #d1d5cb;border-radius:7px;background:#f7f8f2;color:#69745f;font-size:13px;font-weight:750;box-shadow:0 2px 8px #14210c08}
.classroom-page-lock.is-open,.classroom-open-all{border-color:#b7d0aa;background:#f0f7e9;color:#4d7938}
.classroom-lock-all{margin-left:4px;border-color:#cfc8bc;background:#fffdf8;color:#675e50}
.classroom-lock-button:hover:enabled{filter:brightness(.96)}
.classroom-lock-button:disabled{opacity:.45}
.classroom-waiting-panel{position:absolute;inset:0;z-index:7;background:var(--paper);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:30px;color:#6e7b62}
.classroom-waiting-panel strong{font-size:clamp(20px,3vw,36px);letter-spacing:-1px}
.classroom-waiting-panel span{font-size:clamp(13px,1.7vw,20px)}
.classroom-waiting #slide-content,.classroom-waiting #cover-start,.classroom-waiting #slide-next{visibility:hidden}
@media(max-width:650px){
  .classroom-header{padding:0 10px;gap:8px}
  .classroom-header .classroom-banner{font-size:11px}
  .classroom-role{display:none}
  .classroom-header button{font-size:10px;padding:4px 6px}
  .classroom-back{font-size:11px}
  .classroom-lock-controls{bottom:calc(100% + 9px);gap:6px}
  .classroom-lock-label{font-size:11px}
  .classroom-lock-button{min-height:30px;font-size:11px;padding:5px 10px}
  .with-classroom .slide-wrap{width:min(calc(100vw - 20px),calc((100dvh - 154px)*16/9))}
  .classroom-teacher .stage{padding-top:98px}
  .classroom-teacher .slide-wrap{width:min(calc(100vw - 20px),calc((100dvh - 200px)*16/9))}
}
@media print{.classroom-header,.classroom-lock-controls,.classroom-waiting-panel{display:none!important}}

충돌 보호 시간과 구분해서 유지해 줘."}},"item-collection":{"id":"item-collection","type":"design","title":"게임 아이템 추가하기","accent":"아이템","questions":[{"q":"달리면서 무엇을 모을까요?","issues":[{"label":"동전","request":"달리면서 모을 수 있는 금색 동전을 추가해 줘."},{"label":"별","request":"달리면서 모을 수 있는 노란색 별을 추가해 줘."}]}],"activity":{"subject":"아이템","instruction":"달리면서 모을 수 있는 아이템을 만들어 봅시다.","choose":"모을 아이템을 골라 주세요","action":"아이템 추가하기","loading":"모을 아이템을 만들고 있어요…","done":"모을 아이템을 추가했어요.","popup":"아이템을 모으며 게임 해보기","rules":"아이템은 장애물과 겹치지 않도록 적당한 간격으로 만들고, 현재 점프로 닿을 수 있는 높이에 배치해 줘. 주인공이 닿으면 아이템을 즉시 제거하고 수집 개수를 정확히 1만 올려 줘. 기존 거리 점수와 별도로 아이템 이름과 수집 개수를 표시해 줘. 아이템은 목숨을 깎지 않으며 화면 밖으로 나가면 정리해 줘. 게임 종료 시 생성을 멈추고 다시 시작하면 수집 개수와 아이템 목록을 초기화해 줘. 기존 아이템 기능이 있으면 선택한 종류로 교체하고 생성 루프를 중복 등록하지 마."}},"player-ability":{"id":"player-ability","type":"design","title":"주인공 능력 추가하기","accent":"능력","questions":[{"q":"주인공에게 어떤 능력을 줄까요?","issues":[{"label":"두 번 점프","request":"착지하기 전까지 점프를 최대 두 번 할 수 있게 해 줘."},{"label":"잠깐 무적","request":"X 키 또는 화면의 무적 버튼으로 3초 동안 무적이 되게 해 줘."}]}],"activity":{"subject":"능력","instruction":"주인공에게 새로운 능력을 하나 더해 봅시다.","choose":"주인공 능력을 골라 주세요","action":"능력 추가하기","loading":"주인공 능력을 만들고 있어요…","done":"주인공에게 능력을 추가했어요.","popup":"새로운 능력 써보기","rules":"사용자가 선택한 특별 능력 하나만 활성화하고, 이전에 선택한 다른 특별 능력은 교체해 줘. 목숨 감소 뒤의 1.2초 보호 시간은 유지하되 특별 능력과 구분해 줘. 종료·재시작 때 능력 상태와 타이머를 초기화해 줘. 화면에는 현재 선택한 능력의 안내와 버튼만 보여 줘.","optionRules":{"두 번 점프":"이번 선택은 두 번 점프만 활성화하는 것이다. 기존 점프 키로 착지 전 최대 두 번 점프하고 세 번째는 막아 줘. 키를 길게 눌러 반복 입력이 생겨도 추가 점프하지 않게 하고, 착지 때 횟수를 초기화해 줘. 특별 무적 능력은 비활성화하고 X 키 동작, 무적 버튼과 무적 상태 안내를 숨겨 줘. 목숨 감소 뒤 보호 시간은 유지해 줘.","잠깐 무적":"이번 선택은 잠깐 무적만 활성화하는 것이다. 점프는 착지 전 한 번으로 제한해 줘. X 키와 화면의 무적 버튼으로 3초간 무적을 사용하고 재사용 대기는 8초로 해 줘. 사용법, 활성 상태와 남은 대기 시간을 표시해 줘. 목숨 감소 뒤 보호 시간과 별도 상태로 관리해 줘."}}},"jump-sound":{"id":"jump-sound","type":"design","title":"게임 효과음 추가하기","accent":"효과음","questions":[{"q":"점프할 때 어떤 소리가 날까요?","issues":[{"label":"뿅!","request":"점프할 때 음높이가 짧게 올라갔다 내려오는 뿅 효과음을 넣어 줘."},{"label":"띠링!","request":"점프할 때 맑은 두 음이 이어지는 띠링 효과음을 넣어 줘. {"id":"obstacle-design","type":"design","title":"게임 장애물 바꾸기","accent":"장애물","questions":[{"q":"어떤 장애물을 피하게 할까요?","issues":[{"label":"바위","request":"장애물을 울퉁불퉁한 바위 모습으로 바꿔 줘."},{"label":"상자","request":"장애물을 나뭇결과 테두리가 보이는 나무 상자 모습으로 바꿔 줘."}]}]},{"id":"difficulty-tuning","type":"design","title":"게임 난이도 조절하기","accent":"난이도","questions":[{"q":"얼마나 빠르게 달릴까요?","issues":[{"label":"천천히","request":"게임의 기본 달리기 속도를 기준 속도의 0.7배로 설정해 줘."},{"label":"빠르게","request":"게임의 기본 달리기 속도를 기준 속도의 1.3배로 설정해 줘."}]}],"activity":{"subject":"난이도","instruction":"달리는 속도를 바꿔 봅시다.","choose":"난이도를 골라 주세요","action":"난이도 바꾸기","loading":"달리는 속도를 바꾸고 있어요…","done":"게임 난이도를 바꿨어요.","popup":"달리는 속도 확인하기","rules":"달리기 속도와 속도가 증가하는 비율만 조절해 줘. 원래의 기준 속도와 증가 비율을 별도 상수로 보존하고, 같은 선택을 반복해도 배수가 누적되지 않게 해 줘. 장애물의 크기와 생성 간격, 점프 높이와 조작 키, 점수 계산 방식은 유지해 줘."}},{"id":"lives-setting","type":"design","title":"게임 목숨 추가하기","accent":"목숨","questions":[{"q":"목숨을 몇 개로 할까요?","issues":[{"label":"3개","request":"시작할 때 목숨을 3개로 설정해 줘."},{"label":"5개","request":"시작할 때 목숨을 5개로 설정해 줘."}]}],"activity":{"subject":"목숨","instruction":"부딪혀도 다시 도전할 기회를 만들어 봅시다.","choose":"목숨 개수를 골라 주세요","action":"목숨 추가하기","loading":"목숨과 하트 표시를 만들고 있어요…","done":"게임에 목숨을 추가했어요.","popup":"목숨이 줄어드는 모습 확인하기","rules":"현재 목숨을 화면 안에 하트와 숫자로 표시해 줘. 충돌 한 번에 목숨 하나만 줄고 0일 때만 게임이 끝나게 해 줘. 충돌 직후 1.2초간 보호 시간을 주고 주인공을 깜빡이게 하며, 같은 장애물이 반복해서 목숨을 깎지 않게 처리해 줘. 다시 시작하면 선택한 개수로 초기화해 줘. 기존 목숨 기능이 있으면 개수만 갱신하고 중복 추가하지 마. 나중에 추가된 무적 능력이 있다면 충돌 보호 시간과 구분해서 유지해 줘."}},{"id":"item-collection","type":"design","title":"게임 아이템 추가하기","accent":"아이템","questions":[{"q":"달리면서 무엇을 모을까요?","issues":[{"label":"동전","request":"달리면서 모을 수 있는 금색 동전을 추가해 줘."},{"label":"별","request":"달리면서 모을 수 있는 노란색 별을 추가해 줘."}]}],"activity":{"subject":"아이템","instruction":"달리면서 모을 수 있는 아이템을 만들어 봅시다.","choose":"모을 아이템을 골라 주세요","action":"아이템 추가하기","loading":"모을 아이템을 만들고 있어요…","done":"모을 아이템을 추가했어요.","popup":"아이템을 모으며 게임 해보기","rules":"아이템은 장애물과 겹치지 않도록 적당한 간격으로 만들고, 현재 점프로 닿을 수 있는 높이에 배치해 줘. 주인공이 닿으면 아이템을 즉시 제거하고 수집 개수를 정확히 1만 올려 줘. 기존 거리 점수와 별도로 아이템 이름과 수집 개수를 표시해 줘. 아이템은 목숨을 깎지 않으며 화면 밖으로 나가면 정리해 줘. 게임 종료 시 생성을 멈추고 다시 시작하면 수집 개수와 아이템 목록을 초기화해 줘. 기존 아이템 기능이 있으면 선택한 종류로 교체하고 생성 루프를 중복 등록하지 마."}},{"id":"player-ability","type":"design","title":"주인공 능력 추가하기","accent":"능력","questions":[{"q":"주인공에게 어떤 능력을 줄까요?","issues":[{"label":"두 번 점프","request":"착지하기 전까지 점프를 최대 두 번 할 수 있게 해 줘."},{"label":"잠깐 무적","request":"X 키 또는 화면의 무적 버튼으로 3초 동안 무적이 되게 해 줘."}]}],"activity":{"subject":"능력","instruction":"주인공에게 새로운 능력을 하나 더해 봅시다.","choose":"주인공 능력을 골라 주세요","action":"능력 추가하기","loading":"주인공 능력을 만들고 있어요…","done":"주인공에게 능력을 추가했어요.","popup":"새로운 능력 써보기","rules":"사용자가 선택한 특별 능력 하나만 활성화하고, 이전에 선택한 다른 특별 능력은 교체해 줘. 목숨 감소 뒤의 1.2초 보호 시간은 유지하되 특별 능력과 구분해 줘. 종료·재시작 때 능력 상태와 타이머를 초기화해 줘. 화면에는 현재 선택한 능력의 안내와 버튼만 보여 줘.","optionRules":{"두 번 점프":"이번 선택은 두 번 점프만 활성화하는 것이다. 기존 점프 키로 착지 전 최대 두 번 점프하고 세 번째는 막아 줘. 키를 길게 눌러 반복 입력이 생겨도 추가 점프하지 않게 하고, 착지 때 횟수를 초기화해 줘. 특별 무적 능력은 비활성화하고 X 키 동작, 무적 버튼과 무적 상태 안내를 숨겨 줘. 목숨 감소 뒤 보호 시간은 유지해 줘.","잠깐 무적":"이번 선택은 잠깐 무적만 활성화하는 것이다. 점프는 착지 전 한 번으로 제한해 줘. X 키와 화면의 무적 버튼으로 3초간 무적을 사용하고 재사용 대기는 8초로 해 줘. 사용법, 활성 상태와 남은 대기 시간을 표시해 줘. 목숨 감소 뒤 보호 시간과 별도 상태로 관리해 줘."}}},{"id":"jump-sound","type":"design","title":"게임 효과음 추가하기","accent":"효과음","questions":[{"q":"점프할 때 어떤 소리가 날까요?","issues":[{"label":"뿅!","request":"점프할 때 음높이가 짧게 올라갔다 내려오는 뿅 효과음을 넣어 줘."},{"label":"띠링!","request":"점프할 때 맑은 두 음이 이어지는 띠링 효과음을 넣어 줘."}]}],"activity":{"subject":"효과음","instruction":"점프하는 순간에 어울리는 소리를 넣어 봅시다.","choose":"점프 효과음을 골라 주세요","action":"효과음 넣기","loading":"점프 효과음을 만들고 있어요…","done":"점프 효과음을 넣었어요.","popup":"점프 소리 들어보기","rules":"외부 음원 파일 없이 Web Audio API로 짧고 작은 소리를 만들어 줘. AudioContext는 실제 키 누르기나 화면 버튼 클릭 같은 사용자 동작 안에서 생성하거나 resume해 줘. 실제 점프가 성공할 때만 한 번 재생하고, 두 번 점프가 있다면 두 번째 점프에도 재생해 줘. 무시된 점프 입력이나 키 반복 입력에는 재생하지 마. 효과음 길이는 약 0.1~0.25초, gain은 0.08 이하로 해 줘. 화면에 소리 켜기/끄기 버튼을 두고 꺼짐을 존중해 줘. 소리 관련 예외가 생겨도 게임은 계속 실행되게 해 줘. 기존 효과음 기능이 있으면 선택한 음색으로 교체하고 재생기를 중복 연결하지 마."}},{"id":"game-sharing","type":"sharing","title":"내 게임 공유하기","accent":"공유하기"}]}</script>
<script>
'use strict';
function createLessonStorage(storage,room='',sample=false){
  const prefix=(sample?'dino-local-feedback:':'')+(room?'sherpa-room-'+room.toUpperCase()+':':'');
  return {getItem:key=>storage.getItem(prefix+key),setItem:(key,value)=>storage.setItem(prefix+key,value),removeItem:key=>storage.removeItem(prefix+key)};
}
const lessonStorage=createLessonStorage(localStorage,new URLSearchParams(location.search).get('room')||'',location.pathname==='/feedback-test');

const $=id=>document.getElementById(id),embedded=JSON.parse($('deck-data').textContent),storageKey=embedded.id;
const editing=false;let deck=structuredClone(embedded),index=0,inLesson=true;
try{const stored=JSON.parse(lessonStorage.getItem(storageKey));if(stored?.id===embedded.id&&stored.updatedAt>embedded.updatedAt&&Array.isArray(stored.slides)&&stored.slides.length)deck=stored}catch{}
if((deck.schemaVersion||1)<(embedded.schemaVersion||1)){const priorVersion=deck.schemaVersion||1;for(const slide of embedded.slides.filter(s=>(s.id==='game-sharing'&&priorVersion<11)||(s.id==='game-intro'&&priorVersion<2)||(s.id==='play-game'&&priorVersion<3)||(s.id==='game-sentences'&&priorVersion<4)||(s.id==='game-feedback'&&priorVersion<5)||(s.id==='character-design'&&priorVersion<6)||(s.id==='background-design'&&priorVersion<7)||(s.id==='obstacle-design'&&priorVersion<8)||(['difficulty-tuning','lives-setting','item-collection','player-ability','jump-sound'].includes(s.id)&&priorVersion<9)))if(!deck.slides.some(s=>s.id===slide.id))deck.slides.push(structuredClone(slide));if(priorVersion<12){const feedback=deck.slides.find(s=>s.id==='game-feedback'),fresh=embedded.slides.find(s=>s.id==='game-feedback');if(feedback&&fresh){feedback.questions=structuredClone(fresh.questions);feedback.questionVersion=fresh.questionVersion}}deck.assets={...embedded.assets,...deck.assets};deck.presets={...embedded.presets,...deck.presets};deck.schemaVersion=embedded.schemaVersion;deck.updatedAt=Date.now();try{lessonStorage.setItem(storageKey,JSON.stringify(deck))}catch{}}
index=Math.max(0,deck.slides.findIndex(s=>s.id===deck.activeId));
if(embedded.assets.gameDocument)deck.assets.gameDocument=embedded.assets.gameDocument;
// Update only old lesson defaults. Keep learner answers, prompts and generated games.
{
  const previous={
    cover:{title:'바이브 코딩으로\n공룡 게임 만들기',accent:'공룡 게임'},
    'game-intro':{caption:'스페이스바로 점프하며 장애물을 피합니다.'},
    'play-game':{title:'공룡 게임 해보기',notes:'Chromium에서 추출한 wayou/t-rex-runner를 이 HTML에 포함했습니다. https://github.com/wayou/t-rex-runner | BSD-3-Clause 라이선스와 저작권 고지는 내장 게임 문서에 포함됩니다.'}
  };
  for(const slide of [...deck.slides,...Object.values(deck.presets||{})]){
    const fresh=embedded.slides.find(s=>s.id===slide.id);if(!fresh)continue;
    const prior=previous[slide.id]||{},customTitle=prior.title&&slide.title!==prior.title&&slide.title!==fresh.title;
    for(const [key,value] of Object.entries(prior))if(!(key==='accent'&&customTitle)&&slide[key]===value)slide[key]=fresh[key];
    if(slide.id==='game-sentences'&&Array.isArray(slide.questions))slide.questions.forEach((question,i)=>{
      if(question.hint?.includes('선인장')&&question.hint.replaceAll('선인장','장애물')===fresh.questions[i]?.hint)question.hint=fresh.questions[i].hint;
    });
  }
}

const labels={cover:'표지',goals:'학습목표',explanation:'설명',gameIntro:'게임 소개',playGame:'게임 해보기',quiz:'게임을 문장으로',feedback:'게임 오류 고치기',design:'게임 디자인 바꾸기',sharing:'내 게임 공유하기',prompt:'프롬프트',practice:'실습'};
function renderRoute(){index=0;render();($('cover-start').hidden?$('lesson-stage'):$('cover-start')).focus({preventScroll:true})}
function getPath(obj,key){return key.split('.').reduce((o,k)=>o[k],obj)}
function paint(el,text,accent){el.replaceChildren();if(accent&&text.includes(accent)){const at=text.indexOf(accent),span=document.createElement('span');span.className='accent';span.textContent=accent;el.append(document.createTextNode(text.slice(0,at)),span,document.createTextNode(text.slice(at+accent.length)))}else el.textContent=text}
function editor(slide,path,cls,label,highlight=false){const el=document.createElement('div');el.className='editable '+cls;el.dataset.field=path;const text=String(getPath(slide,path)??'');if(highlight)paint(el,text,slide.accent);else el.textContent=text;return el}

function extractedGame(text){

  for(const match of blocks.reverse())if(/<html(?:\s|>)/i.test(match[1])&&/<\/html\s*>/i.test(match[1]))return match[1].trim();
  const plain=text.trim();if(/^(?:<!doctype\s+html\s*>\s*)?<html(?:\s|>)/i.test(plain)&&/<\/html\s*>\s*$/i.test(plain))return plain;
  return null;

  code=code.trim();return code?code.split(/\r\n|\r|\n/).length:0;

function makeGamePrompt(questions,sentences,converted=new Map()){
  const rules=questions.map((question,i)=>{const text=sentences[i].trim();return (i+1)+'. '+(converted.get(String(i))||(text===question.sentence?question.request:text))});
  return '아래 규칙대로 웹에서 실행되는 공룡 게임을 하나의 HTML 파일로 만들어 줘.\n\n'+rules.join('\n')+'\n\nHTML, CSS, JavaScript를 한 파일에 모두 넣고, 브라우저에서 바로 실행할 수 있게 해 줘.';
}
async function convertQuizPrompt(questions,sentences){
  const changed=questions.flatMap((question,i)=>sentences[i].trim()===question.sentence?[]:[{id:String(i),text:sentences[i].trim(),context:question.q}]);
  const converted=changed.length?await receivePromptRequests(changed,'rules'):[];
  const prompt=makeGamePrompt(questions,sentences,new Map(converted.map(item=>[item.id,item.request])));
  if(prompt.length>16000)throw Error('프롬프트가 너무 길어요. 문장을 조금 줄여 주세요.');
  return prompt;
}
function buildQuizActivity(slide,print=false){
  const host=node('quiz-stage');
  if(print){host.classList.add('quiz-print');slide.questions.forEach((q,i)=>host.append(node('',(i+1)+'. '+q.sentence)));return host}
  const state=quizState(slide),questions=slide.questions,total=questions.length;
  if(!promptConversions.has(slide.id))promptConversions.set(slide.id,{busy:false,error:'',onChange:null});
  const conversion=promptConversions.get(slide.id);conversion.onChange=()=>{if(host.isConnected)redraw()};
  let promptDialog=null;const gameJob=generatedGame(slide,state);
  host.dispose=()=>{promptDialog?.close(false);promptDialog=null;if(gameJob.onChange===syncGeneration)gameJob.onChange=null};
  function showResult(){
    if(!state.gameHtml)return;if(!promptDialog)showPrompt(true);if(!promptDialog)return;
    promptDialog.showGame({html:state.gameHtml,title:'내가 만든 공룡 게임',onEdit:()=>{state.mode='prompt';saveQuiz(slide,state)},onNext:()=>{const next=deck.slides.findIndex(item=>item.type==='feedback');if(next>=0&&!canVisitPage(next)){showClassroomBrake();return false}state.mode='game';saveQuiz(slide,state);promptDialog.close(false);promptDialog=null;if(next>=0)go(next)}});
  }
  function syncGeneration(){
    if(!host.isConnected)return;
    if(!promptDialog){if(state.mode==='game')redraw();return}
    if(gameJob.phase==='ready'&&state.mode==='game')showResult();
    else{promptDialog.showPrompt();promptDialog.update({value:state.prompt,busy:gameJob.phase==='loading',message:gameJob.phase==='loading'||['error','stopped'].includes(gameJob.phase)?gameJob.message:''})}
  }
  gameJob.onChange=syncGeneration;
  function showPrompt(forResult=false){
    if(promptDialog||!host.isConnected||!forResult&&state.mode!=='prompt')return;
    promptDialog=openPromptDialog({value:state.prompt,onInput:value=>{state.prompt=value;saveQuiz(slide,state)},onApply:value=>{state.prompt=value;return requestGeneratedGame(slide,state)},onStop:()=>gameJob.controller?.abort(),onClose:phase=>{promptDialog=null;state.mode=phase==='result'?'game':'review';saveQuiz(slide,state);redraw()},returnFocus:host.querySelector('.quiz-primary')});
  }
  function redraw(focusNext=false){draw();if(focusNext)host.querySelector('.quiz-primary')?.focus({preventScroll:true})}
  function draw(){
    host.replaceChildren();
    if(state.mode==='quiz'){
      const q=questions[state.position],answered=state.position<state.answered;
      const progress=node('quiz-progress');progress.append(node('','문제 '+(state.position+1)+' / '+total),node('','모은 문장 '+state.answered+' / '+total));
      const heading=document.createElement('h2');heading.className='quiz-question';heading.textContent=q.q;
      const options=node('quiz-options');options.setAttribute('role','group');options.setAttribute('aria-label','보기 네 개');
      const feedback=node('quiz-feedback');feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');
      if(answered){feedback.append(node('quiz-sentence-label','모은 문장'),node('quiz-sentence',state.sentences[state.position]||q.sentence))}else feedback.textContent='게임에서 본 모습을 떠올려 골라 보세요.';
      q.options.forEach((text,i)=>{
        const button=document.createElement('button');button.type='button';button.className='quiz-option';button.append(node('option-number',['①','②','③','④'][i]),node('',text));button.disabled=answered;button.setAttribute('aria-pressed',String(answered&&i===q.answer));
        if(answered&&i===q.answer)button.classList.add('correct');
        button.onclick=()=>{
          if(state.position<state.answered)return;
          if(i!==q.answer){for(const choice of options.children)choice.classList.remove('wrong');button.classList.add('wrong');feedback.classList.add('is-wrong');feedback.textContent='다시 살펴볼까요?\n'+q.hint;return}
          state.sentences[state.position]=q.sentence;state.answered=state.position+1;saveQuiz(slide,state);redraw(true);
        };options.append(button);
      });
      const footer=node('quiz-footer');
      const previous=quizButton('← 이전 문제',()=>{state.position--;saveQuiz(slide,state);redraw()});previous.disabled=state.position===0;
      const next=quizButton(state.position===total-1?'문장 '+total+'개 모아 보기 →':'다음 문제 →',()=>{if(state.position>=state.answered)return;if(state.position===total-1)state.mode='review';else state.position++;saveQuiz(slide,state);redraw()},true);next.disabled=!answered;
      footer.append(previous,next);host.append(progress,heading,options,feedback,footer);
    }else if(state.mode==='review'||state.mode==='prompt'){
      const heading=node('quiz-question','문장 '+total+'개를 모았어요');
      const instruction=node('quiz-instruction','문장을 읽고, 바꾸고 싶은 내용을 고쳐 보세요.');instruction.setAttribute('role','status');instruction.setAttribute('aria-live','polite');
      const list=node('quiz-review-list');list.setAttribute('aria-label','모은 문장 다듬기');
      const footer=node('quiz-footer');
      const reset=quizButton('처음부터 다시 풀기',()=>{if(conversion.busy)return;conversion.error='';Object.assign(state,freshQuizState());saveQuiz(slide,state);redraw()});reset.disabled=conversion.busy;
      const convert=quizButton(conversion.busy?'명령문으로 바꾸는 중…':'프롬프트로 바꾸기',async()=>{
        if(conversion.busy||state.sentences.some(text=>!text.trim()))return;
        if(state.prompt&&conversion.promptSource===JSON.stringify(state.sentences)){state.mode='prompt';saveQuiz(slide,state);showPrompt();return}
        const snapshot=state.sentences.slice();conversion.busy=true;conversion.error='';redraw();
        try{const prompt=await convertQuizPrompt(questions,snapshot);if(JSON.stringify(state.sentences)!==JSON.stringify(snapshot))throw Error('문장이 바뀌었어요. 다시 변환해 주세요.');state.prompt=prompt;state.mode='prompt';conversion.promptSource=JSON.stringify(snapshot);saveQuiz(slide,state)}
        catch(error){conversion.error=error.message||'문장을 변환하지 못했어요. 다시 시도해 주세요.'}
        finally{conversion.busy=false;conversion.onChange?.()}
      },true);
      function validate(){const empty=state.sentences.some(text=>!text.trim());convert.disabled=conversion.busy||empty;instruction.textContent=conversion.busy?'입력한 뜻을 살려 명령문으로 바꾸고 있어요…':conversion.error||(empty?'빈 문장이 있어요. 내용을 채워 주세요.':'문장을 읽고, 바꾸고 싶은 내용을 고쳐 보세요.')}
      questions.forEach((q,i)=>{const row=node('quiz-review-row');const input=document.createElement('textarea');input.className='quiz-review-input';input.setAttribute('aria-label','모은 문장 '+(i+1));input.maxLength=1000;input.rows=2;input.value=state.sentences[i]??q.sentence;input.disabled=conversion.busy;input.oninput=()=>{state.sentences[i]=input.value;conversion.error='';saveQuiz(slide,state);validate()};row.append(node('quiz-review-number',String(i+1).padStart(2,'0')),input);list.append(row)});
      validate();footer.append(reset,convert);host.append(heading,instruction,list,footer);
      if(state.mode==='prompt')queueMicrotask(showPrompt);
    }else if(state.mode==='game'){
      host.append(node('quiz-question',state.gameHtml?'내가 만든 공룡 게임':'게임 만들기'),node('quiz-instruction',gameJob.phase==='loading'?gameJob.message:'팝업에서 게임을 확인하고 다음 단계로 이동하세요.'));
      const footer=node('quiz-footer'),edit=quizButton('다시 만들기',()=>{state.mode='prompt';saveQuiz(slide,state);showPrompt()}),download=quizButton('HTML 다운로드',()=>downloadGameHtml(state.gameHtml)),view=quizButton('내 게임 보기',showResult,true);edit.disabled=gameJob.phase==='loading';download.disabled=!state.gameHtml;view.disabled=!state.gameHtml;footer.append(edit,download,view);host.append(footer);
    }
  }
  draw();return host;
}

// Voice only fills the editable draft. Applying a prompt always needs another click.
function createFeedbackSpeech(root,onChange){
  const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  const fields=[];let active=null,busy=false,disposed=false;
  const errorMessages={
    'not-allowed':'마이크 사용이 허용되지 않았어요. 브라우저의 마이크 권한을 확인하거나 직접 입력해 주세요.',
    'service-not-allowed':'이 브라우저에서는 음성 인식을 사용할 수 없어요. 직접 입력해 주세요.',
    'audio-capture':'마이크를 찾지 못했어요. 마이크 연결을 확인해 주세요.',
    'network':'음성 인식 연결이 끊겼어요. 인터넷을 확인하거나 직접 입력해 주세요.',
    'no-speech':'목소리를 듣지 못했어요. 다시 누르고 말해 주세요.',
    'language-not-supported':'한국어 음성 인식을 지원하지 않아요. 직접 입력해 주세요.'
  };
  function refresh(){
    for(const field of fields){
      const listening=active?.field===field;
      field.button.textContent=listening?'■ 말하기 멈추기':'🎤 말로 입력';
      field.button.setAttribute('aria-label',field.label+(listening?' 말하기 멈추기':' 말로 입력'));
      field.button.setAttribute('aria-pressed',String(listening));
      field.button.disabled=busy||!Recognition||!window.isSecureContext||!!active&&!listening;
      field.input.readOnly=listening;
    }
  }
  function finish(session,message){
    if(active!==session)return;
    clearTimeout(session.timer);clearTimeout(session.stopTimer);active=null;
    if(message)session.field.status.textContent=message;
    refresh();if(!disposed)onChange?.();
  }
  function stop(){
    const session=active;if(!session||session.stopping)return;
    session.stopping=true;session.field.status.textContent='말하기를 마치고 있어요…';
    try{session.recognition.stop()}catch{finish(session,'입력된 글을 확인하고 수정해 주세요.')}
    session.stopTimer=setTimeout(()=>{
      if(active!==session)return;
      try{session.recognition.abort()}catch{}
      finish(session,'입력된 글을 확인하고 수정해 주세요.');
    },2000);
  }
  function start(field){
    if(disposed||busy||active||!Recognition||!window.isSecureContext)return;
    let recognition;try{recognition=new Recognition()}catch{field.status.textContent='음성 인식을 시작하지 못했어요. 직접 입력해 주세요.';return}
    const session={field,recognition,finals:new Set(),received:false};active=session;
    recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=true;
    field.status.textContent='마이크를 준비하고 있어요…';refresh();onChange?.();
    recognition.onstart=()=>{if(active===session&&!disposed)field.status.textContent='듣고 있어요. 짧게 말한 뒤 멈추기를 눌러 주세요.'};
    recognition.onresult=event=>{
      if(active!==session||disposed||busy||!field.input.isConnected)return;
      let interim='',full=false;
      for(let i=event.resultIndex;i<event.results.length;i++){
        const result=event.results[i],text=result[0]?.transcript?.trim()||'';
        if(!result.isFinal){interim+=text;continue}
        if(session.finals.has(i))continue;session.finals.add(i);if(!text)continue;
        const value=(field.input.value+(field.input.value&&!/\s$/.test(field.input.value)?' ':'')+text);
        field.input.value=value.slice(0,field.input.maxLength>0?field.input.maxLength:500);
        field.input.dispatchEvent(new Event('input',{bubbles:true}));session.received=true;
        full=value.length>=field.input.maxLength;
      }
      field.status.textContent=full?'500자까지 입력했어요. 글을 확인해 주세요.':interim?'인식 중: '+interim:'글로 입력했어요. 계속 말하거나 멈추기를 눌러 주세요.';
      if(full)stop();
    };
    recognition.onerror=event=>{
      if(active!==session||disposed)return;
      const message=errorMessages[event.error]||'음성 인식을 마쳤어요. 입력된 글을 확인하거나 직접 입력해 주세요.';
      try{recognition.abort()}catch{}finish(session,message);
    };
    recognition.onend=()=>{
      if(active!==session||disposed)return;
      finish(session,session.received?'입력된 글을 확인하고 수정한 뒤 프롬프트로 바꿔 주세요.':'인식된 글이 없어요. 다시 말하거나 직접 입력해 주세요.');
    };
    session.timer=setTimeout(stop,60000);
    try{recognition.start()}catch{finish(session,'음성 인식을 시작하지 못했어요. 다시 누르거나 직접 입력해 주세요.')}
  }
  return {
    get listening(){return !!active},
    attach(input,label){
      const wrapper=node('speech-input'),bar=node('speech-bar'),button=document.createElement('button'),status=node('speech-status');
      button.type='button';button.className='speech-button';button.setAttribute('aria-label',label+' 말로 입력');
      status.setAttribute('role','status');status.setAttribute('aria-live','polite');
      status.textContent=!Recognition?'이 브라우저는 음성 입력을 지원하지 않아요. 직접 입력해 주세요.':!window.isSecureContext?'음성 입력은 localhost 또는 HTTPS에서 사용할 수 있어요.':'음성은 브라우저의 인식 서비스로 전송될 수 있어요. 입력 후 확인해 주세요.';
      const field={input,button,status,label};fields.push(field);button.onclick=()=>active?.field===field?stop():start(field);
      bar.append(button,status);wrapper.append(input,bar);refresh();return wrapper;
    },
    setBusy(value){busy=value;if(busy&&active){const session=active;try{session.recognition.abort()}catch{}finish(session,'입력된 글을 확인해 주세요.')}refresh()},
    dispose(){disposed=true;if(active){const session=active;active=null;clearTimeout(session.timer);clearTimeout(session.stopTimer);try{session.recognition.abort()}catch{}}}
  };
}

const feedbackStates=new Map(),repairJobs=new Map();
function feedbackStorage(){return typeof lessonStorage==='undefined'?localStorage:lessonStorage}
function restoreFeedbackState(slide,saved){
  const questionVersion=slide.questionVersion||1,state={selections:{},customEntries:{},prompt:typeof saved?.prompt==='string'?saved.prompt.slice(0,16000):'',revisions:Number.isInteger(saved?.revisions)?saved.revisions:0,completed:saved?.completed===true,questionVersion};
  const shift=slide.id==='game-feedback'&&questionVersion>=2&&(saved?.questionVersion||1)<2?1:0;
  slide.questions.forEach((q,i)=>{const prior=i-shift;if(prior<0)return;const v=saved?.selections?.[prior];if(Number.isInteger(v)&&v>0&&v<=q.issues.length)state.selections[i]=v;if(typeof saved?.customEntries?.[prior]==='string')state.customEntries[i]=saved.customEntries[prior].slice(0,500)});
  return state;
}
function feedbackContext(slide){
  const quiz=deck.slides.find(s=>s.id==='game-sentences');if(!quiz)return null;
  const game=quizState(quiz);if(!game.gameHtml)return null;
  if(!game.gameSession){game.gameSession=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);saveQuiz(quiz,game)}
  const key='sherpa-feedback-'+slide.id+'-'+game.gameSession;
  if(!feedbackStates.has(key)){
    let saved=null;try{saved=JSON.parse(feedbackStorage().getItem(key))}catch{}
    const state=restoreFeedbackState(slide,saved);
    try{feedbackStorage().setItem(key,JSON.stringify(state))}catch{}
    feedbackStates.set(key,state);
  }
  if(!repairJobs.has(key))repairJobs.set(key,{phase:'idle',message:'',receivedLines:0,controller:null,onChange:null,resultPending:false});
  return {quiz,game,key,state:feedbackStates.get(key),job:repairJobs.get(key)};
}
function saveFeedback(context){try{feedbackStorage().setItem(context.key,JSON.stringify(context.state))}catch{}}
function bindErrorTextInput(input,context,index,onCommit){
  let composing=false;
  function commit(){
    if(composing||context.job.phase==='loading')return;
    context.state.customEntries[index]=input.value.slice(0,500);
    context.state.completed=false;context.job.message='';saveFeedback(context);onCommit();
  }
  input.addEventListener('compositionstart',()=>{composing=true});
  input.addEventListener('compositionend',()=>{composing=false;commit()});
  input.addEventListener('input',event=>{if(!event.isComposing)commit()});
  input.addEventListener('change',commit);
  input.addEventListener('keydown',event=>event.stopPropagation());
  input.addEventListener('keyup',event=>event.stopPropagation());
}
function selectedErrors(slide,state){return slide.questions.flatMap((q,i)=>{
  const value=state.selections[i],issue=Number.isInteger(value)&&value>0&&value<=q.issues.length?q.issues[value-1]:null,custom=state.customEntries?.[i]?.trim();
  if(!issue&&!custom)return [];
  return [{choice:issue?.label||'',custom:custom||'',question:q.q,freeText:!!q.freeText,preset:issue?.request||'',request:(slide.type==='design'?'디자인 질문: ':'점검 질문: ')+q.q+'\n'+[issue?.request,custom?(slide.type==='design'?(slide.id==='character-design'?'직접 적은 모습: ':'직접 적은 '+designCopy(slide).subject+': '):'직접 적은 오류: ')+custom:null].filter(Boolean).join('\n')}];
})}
async function convertErrorRequests(issues,signal){
  const items=issues.flatMap((issue,i)=>issue.custom?[{id:String(i),text:issue.custom,context:issue.question}]:[]);
  if(!items.length)return issues;
  const converted=new Map((await receivePromptRequests(items,'errors',signal)).map(item=>[item.id,item.request]));
  return issues.map((issue,i)=>!issue.custom?issue:{...issue,request:'점검 질문: '+issue.question+'\n'+[issue.preset,(issue.freeText?'직접 적은 요청: ':'직접 적은 오류의 수정 요청: ')+converted.get(String(i))].filter(Boolean).join('\n')});
}
async function convertDesignRequests(slide,issues,signal){
  const items=issues.flatMap((issue,i)=>issue.custom?[{id:String(i),text:issue.custom,context:issue.question}]:[]);if(!items.length)return issues;
  const converted=new Map((await receivePromptRequests(items,'rules',signal)).map(item=>[item.id,item.request]));
  return issues.map((issue,i)=>!issue.custom?issue:{...issue,request:'디자인 질문: '+issue.question+'\n'+(slide.id==='character-design'?'직접 적은 모습: ':'직접 적은 '+designCopy(slide).subject+': ')+converted.get(String(i))});
}
function changePrompt(slide,issues){const designer={'background-design':backgroundDesignPrompt,'obstacle-design':obstacleDesignPrompt}[slide.id]||characterDesignPrompt;return slide.type==='design'?(stageActivity(slide)?enhancementPrompt(slide,issues):designer(issues)):repairPrompt(issues)}

  const lastShared=sharedGames.get(game?.gameHtml);if(lastShared){board.href='/board?work='+lastShared;status.textContent='공유한 게임을 게시판에서 볼 수 있어요.'}
  actions.append(download,share,board);root.append(actions,status);
  if(!game?.gameHtml)status.textContent='6쪽에서 게임을 만들면 공유할 수 있어요.';
  let dialog=null,controller=null;
  function closeShare(){if(!dialog)return;dialog.close();dialog.remove();dialog=null;share.focus({preventScroll:true})}
  function openShare(){
    if(dialog||!game?.gameHtml)return;
    const html=game.gameHtml;
    dialog=document.createElement('dialog');dialog.className='sharing-dialog';dialog.setAttribute('aria-labelledby','sharing-dialog-title');
    const heading=document.createElement('h2');heading.id='sharing-dialog-title';heading.textContent='내 게임 공유하기';
    const hint=node('sharing-dialog-hint','작품 제목만 적으면 지금 완성한 HTML 게임이 익명으로 올라가요.');
    const form=document.createElement('form'),titleLabel=document.createElement('label');
    titleLabel.textContent='작품 제목';
    const title=document.createElement('input');
    title.name='title';title.required=true;title.maxLength=80;title.placeholder='예: 점프하는 고양이';
    try{title.value=(new DOMParser().parseFromString(html,'text/html').title||'내가 만든 공룡 게임').trim().slice(0,80)}catch{title.value='내가 만든 공룡 게임'}
    titleLabel.append(title);
    const message=node('sharing-dialog-message');message.setAttribute('role','status');message.setAttribute('aria-live','polite');
    const buttons=node('sharing-dialog-actions'),cancel=quizButton('취소',()=>{if(!controller)closeShare()}),submit=document.createElement('button');submit.type='submit';submit.className='quiz-primary';submit.textContent='게시판에 공유하기';buttons.append(cancel,submit);
    form.append(titleLabel,message,buttons);dialog.append(heading,hint,form);document.body.append(dialog);
    dialog.addEventListener('cancel',event=>{event.preventDefault();if(!controller)closeShare()});
    form.addEventListener('submit',async event=>{
      event.preventDefault();if(controller||!form.reportValidity())return;
      if(!title.value.trim()){message.textContent='작품 제목을 적어 주세요.';return}
      if(location.protocol==='file:'){message.textContent='수업 사이트에서 열면 게시판에 공유할 수 있어요.';return}
      controller=new AbortController();const timeout=setTimeout(()=>controller?.abort(),30000);
      title.disabled=cancel.disabled=submit.disabled=true;submit.textContent='공유 중…';message.textContent='완성한 게임을 게시판에 저장하고 있어요.';
      try{
        const response=await fetch('/api/board',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:title.value.trim(),html}),signal:controller.signal});
        const data=await response.json();if(!response.ok)throw Error(data.error||'공유하지 못했어요. 다시 시도해 주세요.');
        if(!data.item?.id)throw Error('공유 결과를 확인하지 못했어요. 다시 시도해 주세요.');
        sharedGames.set(html,data.item.id);
        board.href='/board?work='+encodeURIComponent(data.item.id);status.textContent=data.duplicate?'이미 공유된 작품이에요. 게시판 보기에서 확인하세요.':'공유했어요! 게시판 보기에서 내 게임을 확인하세요.';
        closeShare();
      }catch(error){if(dialog){message.textContent=error.name==='AbortError'?'연결이 지연되고 있어요. 다시 누르면 같은 작품을 중복 등록하지 않고 확인해요.':error.message;title.disabled=cancel.disabled=submit.disabled=false;submit.textContent='게시판에 공유하기'}}
      finally{clearTimeout(timeout);controller=null}
    });
    dialog.showModal();title.focus();
  }
  root.dispose=()=>{controller?.abort();controller=null;closeShare()};
  return root;
}

// Teacher permission is confirmed by the server. Students can only visit open pages.
const classroomParams=new URLSearchParams(location.search);
const classroom={room:classroomParams.get('room')?.toUpperCase()||null,teacherRequested:classroomParams.get('role')==='teacher',isTeacher:false,openPages:[1],maxPage:1,revision:0,connected:false,message:'',loaded:false,busy:false,waiting:false,name:'',events:false,unavailable:false};
let pendingClassroomState=null;
if(classroom.room)document.body.classList.add('with-classroom');
function canVisitPage(next){return !classroom.room||classroom.isTeacher||classroom.openPages.includes(next+1)}
function classroomNeighbor(direction){
  if(!classroom.room||classroom.isTeacher)return index+direction;
  const pages=classroom.openPages.map(page=>page-1).filter(page=>direction>0?page>index:page<index).sort((a,b)=>direction>0?a-b:b-a);return pages[0]??-1;
}
function stepPage(direction){const next=classroomNeighbor(direction);if(next<0||next>=deck.slides.length){if(classroom.room)showClassroomBrake();return false}return go(next)}
function edgePage(last){const pages=classroom.room&&!classroom.isTeacher?classroom.openPages:deck.slides.map((_,i)=>i+1);if(!pages.length)return;go((last?pages.at(-1):pages[0])-1)}
function updateClassroomNavigation(){
  const banner=$('classroom-banner');if(!banner)return;
  $('classroom-header').hidden=!classroom.room;
  $('classroom-lock-controls').hidden=!classroom.room||!classroom.isTeacher;
  document.body.classList.toggle('classroom-teacher',Boolean(classroom.room&&classroom.isTeacher));
  if(!classroom.room)return;
  banner.hidden=false;banner.textContent=classroom.message||(classroom.connected?(classroom.name+' · 열린 페이지 '+classroom.openPages.length+'/'+deck.slides.length):'수업 연결 중…');
  banner.classList.toggle('is-waiting',!classroom.connected);
  $('classroom-role').textContent=classroom.isTeacher?'선생님':'학생';
  $('classroom-back').href=classroom.isTeacher?'/classes':'/';$('classroom-back').textContent=classroom.isTeacher?'← 수업 목록':'← 홈으로';
  $('classroom-code').textContent='코드 '+classroom.room;
  const next=classroomNeighbor(1),previous=classroomNeighbor(-1);
  $('next').disabled=next<0||next>=deck.slides.length;$('previous').disabled=previous<0||previous>=deck.slides.length;
  $('slide-next').disabled=$('next').disabled;$('cover-start').disabled=$('next').disabled;
  $('page-number').max=deck.slides.length;$('page-number').disabled=classroom.waiting;
  const lock=$('classroom-page-lock'),open=classroom.openPages.includes(index+1);lock.hidden=!classroom.isTeacher;
  lock.textContent=open?'열림':'잠김';lock.classList.toggle('is-open',open);lock.disabled=classroom.busy;
  lock.setAttribute('aria-pressed',String(open));lock.setAttribute('aria-label',(index+1)+'쪽 '+(open?'열림 · 눌러 잠그기':'잠김 · 눌러 열기'));
  lock.title=open?'이 페이지를 학생에게 숨깁니다':'이 페이지를 학생에게 엽니다';
  $('classroom-lock-all').disabled=classroom.busy||!classroom.openPages.length;
  $('classroom-open-all').disabled=classroom.busy||classroom.openPages.length===deck.slides.length;
  $('classroom-waiting').hidden=!classroom.waiting;document.body.classList.toggle('classroom-waiting',classroom.waiting);
  for(const button of [$('next'),$('slide-next'),$('cover-start')])button.title=button.disabled?'선생님이 다음 페이지를 열면 이동할 수 있어요':'';
}
function showClassroomBrake(){classroom.message='아직 잠긴 페이지예요. 선생님이 열어 주시면 이동할 수 있어요.';$('page-number').value=index+1;updateClassroomNavigation()}
function suspendClassroomSlide(){
  const content=$('slide-content');content.querySelector('.error-stage,.quiz-stage,.sharing-stage')?.dispose?.();content.replaceChildren();
}
function classroomUnavailable(){suspendClassroomSlide();pendingClassroomState=null;classroom.unavailable=true;classroom.connected=false;classroom.isTeacher=false;classroom.openPages=[];classroom.waiting=true;classroom.message='삭제되었거나 찾을 수 없는 수업이에요. 참여 코드를 확인해 주세요.';updateClassroomNavigation()}
function receiveClassroomState(data){
  if(classroom.unavailable)return;
  if(data.deleted){classroomUnavailable();return}
  if(classroom.busy){if(!pendingClassroomState||data.revision>=pendingClassroomState.revision)pendingClassroomState=data;return}
  applyClassroomState(data);
}
function applyClassroomState(data){
  if(classroom.unavailable)return;
  if(Number.isInteger(data.revision)&&data.revision<classroom.revision)return;
  if(!Array.isArray(data.openPages)||data.openPages.some(page=>!Number.isInteger(page)||page<1||page>deck.slides.length))throw Error('수업 정보를 확인하지 못했어요.');
  const wasWaiting=classroom.waiting,changed=JSON.stringify(classroom.openPages)!==JSON.stringify(data.openPages);
  classroom.openPages=[...new Set(data.openPages)].sort((a,b)=>a-b);classroom.maxPage=Math.max(0,...classroom.openPages);classroom.revision=data.revision||classroom.revision;classroom.name=data.name||'공룡게임 수업';
  classroom.isTeacher=classroom.teacherRequested&&data.canManage===true;classroom.connected=true;classroom.loaded=true;
  classroom.events=data.events===true;
  if(classroom.teacherRequested&&!classroom.isTeacher){location.replace('/classes?teach='+classroom.room);return}
  classroom.waiting=!classroom.isTeacher&&!classroom.openPages.length;
  if(changed||classroom.message.startsWith('연결')||classroom.message.startsWith('수업'))classroom.message='';
  if(classroom.waiting&&!wasWaiting)suspendClassroomSlide();
  if(!classroom.isTeacher&&!classroom.waiting&&(wasWaiting||!canVisitPage(index))){
    const prior=classroom.openPages.filter(page=>page<=index+1).at(-1)||classroom.openPages[0];index=prior-1;render();
  }
  updateClassroomNavigation();
}
async function changeClassroomPages(change){
  if(!classroom.isTeacher||classroom.busy)return;
  classroom.busy=true;classroom.message='';updateClassroomNavigation();
  try{
    const response=await fetch('/api/classroom/'+classroom.room,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(change),signal:AbortSignal.timeout(6000)}),data=await response.json();
    if(!response.ok)throw Error(data.error||'페이지 상태를 바꾸지 못했어요.');applyClassroomState(data);
  }catch(error){classroom.message=error.message}finally{classroom.busy=false;if(pendingClassroomState){const latest=pendingClassroomState;pendingClassroomState=null;applyClassroomState(latest)}updateClassroomNavigation()}
}
function toggleClassroomPage(){const page=index+1;return changeClassroomPages({page,open:!classroom.openPages.includes(page)})}
function lockAllClassroomPages(){if(classroom.openPages.length)return changeClassroomPages({lockAll:true})}
function openAllClassroomPages(){if(classroom.openPages.length<deck.slides.length)return changeClassroomPages({maxPage:deck.slides.length})}
async function connectClassroom(){
  if(!classroom.room)return;
  $('classroom-page-lock').onclick=toggleClassroomPage;
  $('classroom-lock-all').onclick=lockAllClassroomPages;
  $('classroom-open-all').onclick=openAllClassroomPages;
  $('classroom-code').onclick=async()=>{try{await navigator.clipboard.writeText(classroom.room);classroom.message='참여 코드를 복사했어요.'}catch{classroom.message='참여 코드: '+classroom.room}updateClassroomNavigation()};
  let stopped=false,pending=false,timer,socket=null,socketReady=false,reconnectTimer,reconnectDelay=1000;
  function connectEvents(){
    if(stopped||classroom.unavailable||!classroom.events||reconnectTimer||typeof WebSocket==='undefined'||socket&&socket.readyState<2)return;
    const url=new URL('/api/classroom/'+classroom.room+'/events',location.href);url.protocol=location.protocol==='https:'?'wss:':'ws:';
    let current;try{current=new WebSocket(url)}catch{return}
    socket=current;
    current.onopen=()=>{if(socket!==current)return;socketReady=true;reconnectDelay=1000;clearTimeout(timer);poll()};
    current.onmessage=event=>{
      if(socket!==current||event.data==='pong')return;
      try{const data=JSON.parse(event.data);if(data.code!==classroom.room)throw Error('Wrong classroom');receiveClassroomState(data);if(classroom.unavailable){clearTimeout(timer);clearTimeout(reconnectTimer);current.close(1000,'Classroom deleted')}}catch{current.close(1008,'Invalid classroom state')}
    };
    current.onerror=()=>current.close();
    current.onclose=()=>{if(socket!==current)return;socket=null;socketReady=false;if(stopped||classroom.unavailable)return;clearTimeout(timer);poll();clearTimeout(reconnectTimer);reconnectTimer=setTimeout(()=>{reconnectTimer=null;connectEvents()},reconnectDelay+Math.random()*250);reconnectDelay=Math.min(15000,reconnectDelay*2)};
  }
  async function poll(){
    if(stopped||pending||classroom.unavailable)return;pending=true;
    try{
      const response=await fetch('/api/classroom/'+encodeURIComponent(classroom.room),{cache:'no-store',signal:AbortSignal.timeout(8000)}),data=await response.json();
      if(!response.ok)throw Object.assign(Error(data.error||'수업 연결을 확인해 주세요.'),{status:response.status});
      receiveClassroomState(data);
    }catch(error){
      if(error.status===404||error.status===410)classroomUnavailable();
      else if(!socketReady){classroom.connected=false;classroom.message='연결을 확인해 주세요. 마지막으로 열린 페이지만 이동할 수 있어요.'}
    }finally{pending=false;updateClassroomNavigation();if(!stopped&&!classroom.unavailable){connectEvents();clearTimeout(timer);timer=setTimeout(poll,socketReady?30000+Math.random()*5000:1500+Math.random()*250)}}
  }
  window.addEventListener('pagehide',()=>{stopped=true;clearTimeout(timer);clearTimeout(reconnectTimer);reconnectTimer=null;socket?.close()},{once:true});
  window.addEventListener('pageshow',event=>{if(event.persisted){stopped=false;poll()}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){clearTimeout(timer);poll()}});
  await poll();
}

renderRoute();
connectClassroom();
</script>
