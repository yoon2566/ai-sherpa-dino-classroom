<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수업 참여</title><link rel="stylesheet" href="/lounge-portal.css"></head>
<body>
<header id="teacher-header" class="site-header" hidden><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">a.</span>모두의 AI 라운지</a><a class="home-link" href="/">홈으로 ↗</a></header>
<main>
  <section id="home-view" class="join-view"><form id="join-form" class="join-form"><label for="join-code">수업 참여 코드</label><input id="join-code" class="join-code" name="code" maxlength="6" required autocomplete="off" spellcheck="false" placeholder="ABC123" pattern="[a-fA-F0-9]{6}"><button class="button primary join-submit" type="submit">입장하기 <span aria-hidden="true">→</span></button><p id="join-error" class="form-error" role="status"></p></form><button id="teacher-open" class="teacher-floating" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="7" r="3" stroke="currentColor" stroke-width="1.6"/><path d="M3 20v-4a6 6 0 0 1 12 0v4M15 4h6v11h-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>선생님</button></section>
  <section id="classes-view" hidden><h1>수업 목록</h1><div id="class-grid" class="class-grid" aria-label="수업 목록"></div><button id="create-open" class="create-floating" type="button"><span aria-hidden="true">＋</span> 수업 만들기</button></section>
  <p id="page-status" class="page-status" role="status" aria-live="polite"></p>
</main>
<dialog id="teacher-dialog"><form id="teacher-form"><div class="dialog-heading"><h2>선생님 입장</h2><button type="button" class="close-dialog" aria-label="닫기">×</button></div><label for="teacher-password">비밀번호</label><input id="teacher-password" name="password" type="password" required autocomplete="current-password" maxlength="128"><p id="teacher-error" class="form-error" role="status"></p><button class="button primary submit-button" type="submit">입장하기 →</button></form></dialog>
<dialog id="create-dialog"><form id="create-form"><div class="dialog-heading"><h2>수업 만들기</h2><button type="button" class="close-dialog" aria-label="닫기">×</button></div><label for="class-name">수업 제목</label><input id="class-name" name="name" maxlength="60" required autocomplete="off" placeholder="수업 제목을 적어 주세요"><p id="create-error" class="form-error" role="status"></p><button class="button primary submit-button" type="submit">만들기</button></form></dialog>
<dialog id="delete-dialog"><form id="delete-form"><div class="dialog-heading"><h2>이 수업을 삭제할까요?</h2><button type="button" class="close-dialog" aria-label="닫기">×</button></div><p id="delete-class-name" class="delete-class-name"></p><p class="delete-description">목록에서 사라지고 참여 코드로 입장할 수 없게 됩니다.</p><p id="delete-error" class="form-error" role="status"></p><div class="delete-actions"><button id="delete-cancel" class="button" type="button">취소</button><button class="button danger" type="submit">삭제</button></div></form></dialog>
<template id="class-card-template"><article class="class-card" tabindex="-1"><div class="card-head"><h2 class="class-name"></h2><button class="delete-class" type="button">삭제</button></div><div class="card-code"><span>참여 코드</span><strong></strong></div><div class="card-date"><span>만든 날짜</span><time></time></div><button class="button teacher-enter" type="button">선생님으로 입장 <span aria-hidden="true">→</span></button></article></template>
<script src="/lounge-portal.js"></script></body></html>
