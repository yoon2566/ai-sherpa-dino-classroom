if((deck.schemaVersion||1)<(embedded.schemaVersion||1)){const priorVersion=deck.schemaVersion||1;for(const slide of embedded.slides.filter(s=>(s.id==='game-sharing'&&priorVersion<11)||(s.id==='game-intro'&&priorVersion<2)||(s.id==='play-game'&&priorVersion<3)||(s.id==='game-sentences'&&priorVersion<4)||(s.id==='game-feedback'&&priorVersion<5)||(s.id==='character-design'&&priorVersion<6)||(s.id==='background-design'&&priorVersion<7)||(s.id==='obstacle-design'&&priorVersion<8)||(['difficulty-tuning','lives-setting','item-collection','player-ability','jump-sound'].includes(s.id)&&priorVersion<9)))if(!deck.slides.some(s=>s.id===slide.id))deck.slides.push(structuredClone(slide));if(priorVersion<12){const feedback=deck.slides.find(s=>s.id==='game-feedback'),fresh=embedded.slides.find(s=>s.id==='game-feedback');if(feedback&&fresh){feedback.questions=structuredClone(fresh.questions);feedback.questionVersion=fresh.questionVersion}}deck.assets={...embedded.assets,...deck.assets};deck.presets={...embedded.presets,...deck.presets};deck.schemaVersion=embedded.schemaVersion;deck.updatedAt=Date.now();try{lessonStorage.setItem(storageKey,JSON.stringify(deck))}catch{}}

const labels={cover:'표지',goals:'학습목표',explanation:'설명',gameIntro:'게임 소개',playGame:'게임 해보기',quiz:'게임을 문장으로',feedback:'게임 오류 고치기',design:'게임 디자인 바꾸기',sharing:'내 게임 공유하기',prompt:'프롬프트',practice:'실습'};
function renderRoute(){index=0;render();($('cover-start').hidden?$('lesson-stage'):$('cover-start')).focus({preventScroll:true})}
function getPath(obj,key){return key.split('.').reduce((o,k)=>o[k],obj)}
function paint(el,text,accent){el.replaceChildren();if(accent&&text.includes(accent)){const at=text.indexOf(accent),span=document.createElement('span');span.className='accent';span.textContent=accent;el.append(document.createTextNode(text.slice(0,at)),span,document.createTextNode(text.slice(at+accent.length)))}else el.textContent=text}
function editor(slide,path,cls,label,highlight=false){const el=document.createElement('div');el.className='editable '+cls;el.dataset.field=path;const text=String(getPath(slide,path)??'');if(highlight)paint(el,text,slide.accent);else el.textContent=text;return el}

else if(slide.type==='goals'){const list=node('goals-list');slide.goals.forEach((goal,i)=>{const row=node('goal-row');row.append(node('goal-number',String(i+1).padStart(2,'0')),editor(slide,'goals.'+i,'goal-text','학습목표 '+(i+1)));list.append(row)});root.append(list);}
else if(slide.type==='explanation'){root.append(editor(slide,'body','explanation-body','설명 본문'));const line=node('flow-line'),flow=node('flow');slide.flow.forEach((word,i)=>{if(i)flow.append(node('flow-arrow','→'));flow.append(editor(slide,'flow.'+i,'flow-word','흐름 '+(i+1)))});root.append(line,flow,node('keyboard'));}
else if(slide.type==='gameIntro'){root.append(editor(slide,'body','game-intro-body','게임 소개 본문'));const img=document.createElement('img');img.className='game-intro-image';img.src=slide.image||deck.assets.chromeDino;img.alt='구글 공식 블로그에서 공개한 크롬 공룡 게임 플레이 장면';root.append(img,editor(slide,'caption','game-intro-caption','게임 조작 안내'));}
else if(slide.type==='sharing'){root.append(buildSharingActivity(slide,print));}
else if(slide.type==='quiz'){root.append(buildQuizActivity(slide,print));}
else if(['feedback','design'].includes(slide.type)){root.append(buildErrorActivity(slide,print));}
else if(slide.type==='playGame'){root.append(editor(slide,'caption','game-play-caption','게임 조작 안내'));if(!print){const frame=document.createElement('iframe');frame.className='game-frame';frame.title='직접 하는 트리케라톱스 질주 게임';frame.setAttribute('sandbox','allow-scripts allow-same-origin');frame.srcdoc=deck.assets.gameDocument;root.append(frame);const actions=node('game-actions');for(const [text,command] of [['시작 / 점프','tap'],['다시 시작','restart']]){const button=document.createElement('button');button.type='button';button.textContent=text;button.disabled=editing;button.onclick=()=>{frame.focus();frame.contentWindow.postMessage({channel:'lounge-dino',command},'*')};actions.append(button)}actions.append(node('game-hint','게임 화면을 눌러 시작해도 됩니다.'));root.append(actions);}}
else if(slide.type==='prompt'){root.append(node('quote-open','“'),editor(slide,'body','quote-body','프롬프트 본문'),node('quote-close','”'),node('prompt-rule'),editor(slide,'caption','prompt-caption','실행 안내'));}
else if(slide.type==='practice'){const steps=node('practice-steps');slide.steps.forEach((step,i)=>steps.append(editor(slide,'steps.'+i,'practice-step','실습 순서 '+(i+1))));const visual=node('practice-visual');const img=document.createElement('img');img.src=slide.image||deck.assets.practice;img.alt='공룡 점프 게임 예시 이미지';img.className='practice-img';visual.append(img);if(!slide.image||slide.exampleScore){const score=node('example-score','00012');visual.append(score)}visual.title=editing?'두 번 눌러 이미지를 바꾸세요':'';visual.ondblclick=()=>{if(editing)$('image-file').click()};root.append(steps,visual);}
if(print)root.querySelectorAll('[contenteditable]').forEach(el=>el.setAttribute('contenteditable','false'));return root}
function fitElement(el,max,min){el.style.fontSize=max+'px';let size=max;while((el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+2)&&size>min){size--;el.style.fontSize=size+'px'}}
function fit(){const root=$('slide-content').firstElementChild;if(!root)return;root.style.transform='scale('+($('slide-wrap').clientWidth/1280)+')';const type=root.dataset.type;fitElement(root.querySelector('.title'),type==='cover'?99:92,type==='cover'?61:57);const rules={cover:['.subtitle',43,28],explanation:['.explanation-body',52,30],prompt:['.quote-body',53,28]};if(rules[type]){const [selector,max,min]=rules[type];fitElement(root.querySelector(selector),max,min)}root.querySelectorAll('.flow-word').forEach(el=>fitElement(el,61,36));root.querySelectorAll('.practice-step').forEach(el=>fitElement(el,36,25));root.querySelectorAll('.goal-text').forEach(el=>fitElement(el,44,30));const caption=root.querySelector('.prompt-caption');if(caption)fitElement(caption,38,25);}

function go(next){if(!inLesson||!Number.isInteger(next)||next<0||next>=deck.slides.length)return false;if(!canVisitPage(next)){showClassroomBrake();return false}if(index===next)return true;index=next;render();return true}

$('cover-start').onclick=()=>{if(index!==0||deck.slides[index].type!=='cover')return;stepPage(1);$('lesson-stage').focus({preventScroll:true})};
$('previous').onclick=()=>stepPage(-1);$('next').onclick=()=>stepPage(1);function jump(value){const n=Number(value);if(Number.isInteger(n)&&n>=1&&n<=deck.slides.length)go(n-1)}$('page-number').oninput=e=>jump(e.target.value);$('page-number').onchange=e=>{jump(e.target.value);e.target.value=index+1};
window.addEventListener('message',e=>{const frame=$('slide-content').querySelector('.game-frame');if(frame&&e.source===frame.contentWindow&&e.data?.channel==='lounge-dino'&&[-1,1].includes(e.data.navigate))stepPage(e.data.navigate)});
for(const eventName of ['keydown','keyup'])document.addEventListener(eventName,e=>{const frame=$('slide-content').querySelector('.game-frame');if(e.isComposing||e.keyCode===229||!frame||editing||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)||e.target.isContentEditable)return;const code={Space:32,ArrowUp:38,ArrowDown:40,Enter:13}[e.code];if(code){e.preventDefault();frame.contentWindow.postMessage({channel:'lounge-dino',code,down:eventName==='keydown'},'*')}});
document.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229||!inLesson||e.ctrlKey||e.metaKey||e.altKey||document.querySelector('.error-result-popup[open],.prompt-dialog[open],.sharing-dialog[open]')||e.target.closest('.error-list'))return;const typing=['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);if(typing)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();stepPage(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();stepPage(-1)}if(e.key==='Home'){e.preventDefault();edgePage(false)}if(e.key==='End'){e.preventDefault();edgePage(true)}if(e.key.toLowerCase()==='f'){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})}});
window.addEventListener('resize',fit);document.addEventListener('fullscreenchange',()=>{document.body.classList.toggle('presentation-full',!!document.fullscreenElement);fit()});document.fonts.ready.then(fit);
window.addEventListener('beforeprint',()=>{const host=$('print-deck');host.replaceChildren();deck.slides.forEach(slide=>{const sheet=node('print-sheet'),content=buildSlide(slide,true);sheet.append(content);host.append(sheet)})});window.addEventListener('afterprint',()=>$('print-deck').replaceChildren());
__QUIZ_RUNTIME__
renderRoute();
connectClassroom();
</script>
